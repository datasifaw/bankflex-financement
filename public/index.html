
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BankFlex - Financement à prix fixe</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Barre de navigation principale -->
    <header
        class="navbar navbar-dark px-4 py-3"
        style="background-color: #102a50;"
    >
        <div class="container-fluid">

            <!-- Logo et nom -->
            <div class="d-flex align-items-center gap-3">

                <i
                    class="bi bi-bar-chart-fill fs-3"
                    style="color: #60a5fa;"
                ></i>

                <span class="navbar-brand fw-bold fs-4 mb-0">
                    BankFlex
                </span>

                <span class="text-white-50 border-start ps-3">
                    Financement à prix fixe
                </span>

            </div>

            <!-- Notifications -->
            <div class="text-white fs-4">
                <i class="bi bi-bell"></i>
            </div>

        </div>
    </header>

    <!-- Contenu principal -->
    <main class="container-fluid p-4">

        <h2 class="fw-bold">
            Bienvenue sur BankFlex
        </h2>

        <p class="text-secondary">
            Simulez le financement de vos biens
            en toute transparence.
        </p>

    </main>

</body>
</html>
